name: CI

on:
  push:
    branches: [ main, master, dev-sam ]
  pull_request:
    branches: [ main, master ]

jobs:
  python:
    name: Python runtime
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Hermetic Unit Tests (Stdlib)
      run: |
        python -m unittest test_anima.py

    - name: Run End-to-End Test Suite (Stdlib)
      run: |
        python -m unittest test_e2e.py

    - name: Run CLI Dual-Mode Smoke Test
      run: |
        python anima.py "toggle wifi" --mock
        python anima.py "toggle wifi" --mock

  android:
    name: Android daemon APK
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # AGP 8.5 requires JDK 17 exactly; a newer JDK fails with
    # "Unsupported class file major version".
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # `packages` must be set explicitly: the action's default is
    # "tools platform-tools", and the obsolete `tools` package no longer exists
    # in the SDK repository, so the default configuration fails outright with
    # "Warning: Failed to find package 'tools'".
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run JVM unit tests (engine, hermetic -- no device)
      working-directory: android
      run: ./gradlew :app:testDebugUnitTest

    - name: Build debug APK
      working-directory: android
      run: ./gradlew :app:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: anima-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
